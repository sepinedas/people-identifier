[project]
name = "face-id-cli"
version = "0.2.0"
description = "Offline CLI to enroll and recognize people's faces using deep learning (deepface library)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "deepface>=0.0.75",
    "opencv-python>=5.0.0.93",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "tensorflow>=2.20.0",
    "tf-keras>=2.20.0",
    "dlib>=20.0.1",
    "mediapipe>=0.10.35",
    "facenet-pytorch>=2.5.3",
    "opencv-contrib-python>=5.0.0.93",
]

[project.scripts]
face-id = "face_id:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["face_id.py"]
