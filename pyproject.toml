[project]
name = "face-id-cli"
version = "0.2.0"
description = "Offline CLI to enroll and recognize people's faces using deep learning (face_recognition library)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "face_recognition>=1.3.5",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
]

[project.scripts]
face-id = "face_id:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["face_id.py"]
