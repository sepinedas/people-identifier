[project]
name = "face-id-cli"
version = "0.1.0"
description = "Offline CLI to enroll and recognize people's faces using OpenCV (Haar cascade + LBPH)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-contrib-python>=4.8.0",
    "numpy>=1.24.0",
]

[project.scripts]
face-id = "face_id:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["face_id.py"]
